<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@400;500;600;700&family=El+Messiri:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600&family=Tajawal:wght@200;300;400;500;700;800&family=Noto+Naskh+Arabic:wght@400;500;600&family=Lalezar&family=Readex+Pro:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Marcellus&display=block">
<style>
:root{--bg:#f8f2f6;--ink:#2c1427;--mute:#7c6276;--accent:#502747;--panel:#eee2ea;--W:1080px;--H:1350px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
body{position:relative;font-family:'IBM Plex Sans Arabic',sans-serif;font-feature-settings:"kern","liga","calt"}
.vis{position:absolute;background-size:cover;background-position:center;background:radial-gradient(60% 50% at 50% 42%,color-mix(in srgb,var(--accent) 55%,transparent),transparent 70%),radial-gradient(120% 80% at 50% 120%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),var(--panel)}
.mark{font-family:'Reem Kufi',sans-serif;font-weight:600;letter-spacing:0;display:inline-flex;align-items:baseline;gap:.45em;white-space:nowrap}
.mark small{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:.5em;letter-spacing:.32em;text-transform:uppercase;opacity:.75;direction:ltr}
.num{font-family:'Readex Pro',sans-serif;font-feature-settings:"tnum";direction:ltr;unicode-bidi:isolate}

.vis{inset:0}
.vis::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.35))}
.card{position:absolute;right:60px;left:60px;bottom:56px;background:var(--bg);border-radius:28px;padding:46px 56px;box-shadow:0 30px 60px -30px rgba(0,0,0,.35);display:flex;flex-direction:column}
h1{font:700 52px/1.3 'El Messiri',sans-serif;color:var(--ink);margin-bottom:22px}
ul{list-style:none;display:grid;gap:18px}
li{display:flex;gap:18px;align-items:baseline;font:500 30px/1.5 'IBM Plex Sans Arabic';color:var(--ink)}
li::before{content:"";flex:0 0 14px;height:14px;border-radius:50%;border:2px solid var(--accent);transform:translateY(-2px)}
.mk{margin-top:30px;padding-top:22px;border-top:1px solid color-mix(in srgb,var(--ink) 14%,transparent);font-size:26px;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
</style></head><body><div class="vis"></div><div class="card"><h1>مترددة؟<br>ابدئي بشهر واحد</h1><ul><li><span>الماسك هدية مع كل كورس شهر</span></li><li><span>قسّطيها مع تمارا وتابي</span></li><li><span>الشحن مجاني، والتوصيل عادة من <span class="num">2</span> إلى <span class="num">5</span> أيام</span></li></ul><div class="mk"><span class="mark">كوزما كولاجين<small>COZMAZONE</small></span><span style="font:600 24px 'IBM Plex Sans Arabic';color:var(--accent)">ابدئي بالشهر</span></div></div></body></html>
