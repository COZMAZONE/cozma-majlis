<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@400;500;600;700&family=El+Messiri:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600&family=Tajawal:wght@200;300;400;500;700;800&family=Noto+Naskh+Arabic:wght@400;500;600&family=Lalezar&family=Readex+Pro:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Marcellus&display=block">
<style>
:root{--bg:#502747;--ink:#f7eef4;--mute:#d9c2d2;--accent:#f0c9a4;--panel:#43203b;--W:1600px;--H:900px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:900px;overflow:hidden;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
body{position:relative;font-family:'IBM Plex Sans Arabic',sans-serif;font-feature-settings:"kern","liga","calt"}
.vis{position:absolute;background-size:cover;background-position:center;background:radial-gradient(60% 50% at 50% 42%,color-mix(in srgb,var(--accent) 55%,transparent),transparent 70%),radial-gradient(120% 80% at 50% 120%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),var(--panel)}
.mark{font-family:'Reem Kufi',sans-serif;font-weight:600;letter-spacing:0;display:inline-flex;align-items:baseline;gap:.45em;white-space:nowrap}
.mark small{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:.5em;letter-spacing:.32em;text-transform:uppercase;opacity:.75;direction:ltr}
.num{font-family:'Readex Pro',sans-serif;font-feature-settings:"tnum";direction:ltr;unicode-bidi:isolate}

.vis{inset:0 0 0 0}
.vis::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 88%,transparent) 36%,transparent 70%)}
nav{position:absolute;top:0;right:0;left:0;height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 80px;border-bottom:1px solid color-mix(in srgb,var(--ink) 12%,transparent);font:400 20px 'IBM Plex Sans Arabic';color:var(--mute);z-index:2}
nav .mark{font-size:30px;color:var(--ink)} nav .links{display:flex;gap:40px}
.txt{position:absolute;right:80px;top:230px;width:640px;z-index:2}
.kick{font:500 22px 'IBM Plex Sans Arabic';color:var(--accent);margin-bottom:20px}
h1{font:700 76px/1.22 'El Messiri',sans-serif;color:var(--ink);margin-bottom:24px}
p{font:400 27px/1.7 'IBM Plex Sans Arabic';color:var(--mute);margin-bottom:40px}
.cta{display:inline-flex;gap:24px;align-items:center}
.btn{background:var(--accent);color:var(--bg);font:600 24px 'IBM Plex Sans Arabic';padding:18px 40px;border-radius:999px}
.price{font:500 24px 'IBM Plex Sans Arabic';color:var(--ink)}
</style></head><body><div class="vis"></div><nav><span class="mark">كوزما كولاجين<small>COZMAZONE</small></span><div class="links"><span>الكورسات</span><span>الماسك</span><span>الباقات</span><span>تواصل</span></div></nav><div class="txt"><div class="kick">شهر واحد. والماسك علينا.</div><h1>ابدئي بشهر.<br>وكمّلي لما تبين.</h1><p>الباقات الأكبر هنا بأسعارها الحقيقية، فوق زر «أضف للسلة».</p><div class="cta"><span class="btn">ابدئي بالشهر</span><span class="price"><span class="num">495</span> ر.س · <span class="num">890</span> ر.س · <span class="num">1,330</span> ر.س</span></div></div></body></html>
